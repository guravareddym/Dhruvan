<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gyaan Arena: gamified practice on the latest NCERT books for Class 6 to 10 and College.">
<style>[hidden]{display:none!important}</style>
<title>Gyaan Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: exercise-book page. Graph-paper ground, ink-blue text, highlighter for rewards; dark mode is a chalkboard. */
:root {
  --bg: #eef3fa; --grid: #dbe4f2; --surface: #ffffff; --surface-2: #f5f8fd;
  --ink: #1b2550; --muted: #56618a; --line: #cad5e9;
  --accent: #2457d6; --accent-ink: #ffffff; --marker: #ffd23f; --marker-ink: #3a2c00;
  --ok: #138556; --ok-soft: #dcf3e8; --bad: #cf3342; --bad-soft: #fde3e6;
  --math: #2457d6; --sci: #12846a; --eng: #c84f26; --gk: #9a6c00;
  --shadow: 0 1px 0 #cad5e9, 0 6px 18px rgba(27, 37, 80, .06);
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13211b; --grid: #1a2d24; --surface: #1b2d24; --surface-2: #20352b;
  --ink: #eef2e8; --muted: #a8b9ad; --line: #30483b;
  --accent: #8fb6ff; --accent-ink: #0f1d17; --marker: #ffd95e; --marker-ink: #2c2300;
  --ok: #62d39c; --ok-soft: #1f3f31; --bad: #ff8590; --bad-soft: #452428;
  --math: #8fb6ff; --sci: #6fd8bb; --eng: #ff9f7a; --gk: #f0c35a;
  --shadow: 0 1px 0 #30483b, 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #13211b; --grid: #1a2d24; --surface: #1b2d24; --surface-2: #20352b;
  --ink: #eef2e8; --muted: #a8b9ad; --line: #30483b;
  --accent: #8fb6ff; --accent-ink: #0f1d17; --marker: #ffd95e; --marker-ink: #2c2300;
  --ok: #62d39c; --ok-soft: #1f3f31; --bad: #ff8590; --bad-soft: #452428;
  --math: #8fb6ff; --sci: #6fd8bb; --eng: #ff9f7a; --gk: #f0c35a;
  --shadow: 0 1px 0 #30483b, 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--ink); font: 15px/1.55 var(--body);
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; }
h2 { font-size: 26px; font-weight: 700; }
h3 { font-size: 19px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.hl { background: linear-gradient(transparent 55%, var(--marker) 55%, var(--marker) 90%, transparent 90%); padding: 0 2px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 2px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 16px; height: 60px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 22px; background: none; border: 0; padding: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 18px; transform: rotate(-6deg); }
.nav { display: flex; gap: 4px; margin-left: 12px; }
.nav button { border: 0; background: none; padding: 8px 12px; border-radius: 10px; font-weight: 500; color: var(--muted); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--marker); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.coins { display: inline-flex; align-items: center; gap: 6px; background: var(--marker); color: var(--marker-ink); font-family: var(--display); font-weight: 700; padding: 3px 12px 2px; border-radius: 999px; font-size: 17px; }
.coin { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, #f2b705 60%, #c98a00); box-shadow: inset 0 0 0 1.5px #b37a00; flex: none; }
.me-btn { border: 0; background: none; padding: 0; border-radius: 50%; }

.tabbar { display: none; }
main {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
  display: grid; gap: 20px;
}
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid3 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.btn { border: 1.5px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { border-color: var(--accent); }
a.btn { text-decoration: none; color: var(--ink); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-marker { background: var(--marker); border-color: var(--marker); color: var(--marker-ink); }
.btn-ghost { background: none; border-color: transparent; color: var(--muted); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-lg { padding: 13px 22px; font-size: 17px; border-radius: 13px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-weight: 500; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[disabled] { opacity: .45; cursor: not-allowed; }
.bar { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .5s ease; }
.bar.marker > i { background: var(--marker); }
.stars { display: inline-flex; gap: 1px; font-size: 15px; letter-spacing: 0; color: var(--line); }
.stars .on { color: #f2b705; }
.subj { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.s-math { --sc: var(--math); } .s-sci { --sc: var(--sci); } .s-eng { --sc: var(--eng); } .s-gk { --sc: var(--gk); }
.subj { background: var(--sc); }
.field { display: grid; gap: 6px; }
.field input, .field select { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; width: 100%; }
.field input:focus { border-color: var(--accent); outline: none; }
.err { color: var(--bad); font-size: 14px; min-height: 1.4em; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 600; z-index: 30; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* Login */
.login { display: grid; gap: 24px; grid-template-columns: 1.1fr 1fr; align-items: start; }
.hero-art { display: flex; gap: 8px; align-items: flex-end; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.profile-pick { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--surface); text-align: left; width: 100%; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 11px; padding: 3px; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* Home */
.hello { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; }
.statline { display: flex; gap: 22px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--display); font-size: 26px; line-height: 1; }
.skill-card { display: grid; gap: 10px; border-left: 5px solid var(--sc); }
.skill-card h3 { font-size: 17px; }
.game-card { display: grid; gap: 10px; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.game-card:hover { border-color: var(--accent); }
.game-ico { font-family: var(--display); font-weight: 800; font-size: 26px; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); border: 1.5px dashed var(--line); }

/* Quiz */
.quiz { max-width: 720px; width: 100%; margin: 0 auto; display: grid; gap: 18px; }
.dots { display: flex; gap: 6px; }
.dots i { flex: 1; height: 7px; border-radius: 4px; background: var(--line); }
.dots i.ok { background: var(--ok); } .dots i.bad { background: var(--bad); } .dots i.cur { background: var(--accent); }
.qtext { font-family: var(--display); font-size: clamp(22px, 3.6vw, 30px); font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.opts { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 13px; padding: 14px 16px; text-align: left; font-size: 17px; font-weight: 500; display: flex; gap: 12px; align-items: center; min-height: 60px; overflow-wrap: anywhere; }
.opt:hover:not([disabled]) { border-color: var(--accent); transform: translateY(-1px); }
.opt kbd { font: 600 12px var(--body); border: 1.5px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--muted); flex: none; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.feedback { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; font-weight: 600; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.combo { font-family: var(--display); font-weight: 800; color: var(--eng); }
.result-big { font-family: var(--display); font-size: 64px; font-weight: 800; line-height: 1; }
@keyframes pop { 0% { transform: scale(.92); } 70% { transform: scale(1.03); } 100% { transform: scale(1); } }
.pop { animation: pop .4s ease-out; }

/* Games */
.arena { max-width: 640px; width: 100%; margin: 0 auto; display: grid; gap: 16px; text-align: center; }
.timer { font-family: var(--display); font-size: 22px; font-weight: 800; }
.big-q { font-family: var(--display); font-size: clamp(44px, 9vw, 72px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.answer-box { font-family: var(--display); font-size: 40px; font-weight: 700; min-height: 64px; border: 2px dashed var(--line); border-radius: 14px; display: grid; place-items: center; background: var(--surface); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 330px; margin: 0 auto; width: 100%; }
.keypad button { font-family: var(--display); font-size: 24px; font-weight: 700; padding: 10px 0; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.tiles { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.tile { width: 84px; height: 84px; border-radius: 18px; border: 2.5px solid var(--line); background: var(--surface); font-family: var(--display); font-size: 30px; font-weight: 800; box-shadow: 0 4px 0 var(--line); }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 4px 0 var(--accent); transform: translateY(-3px); }
.tile.small-f { font-size: 22px; }
.ops { display: flex; gap: 10px; justify-content: center; }
.ops button { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface-2); font-size: 28px; font-weight: 700; }
.ops button[aria-pressed="true"] { background: var(--marker); border-color: var(--marker); color: var(--marker-ink); }
.letters { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.letter { width: 46px; height: 52px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-family: var(--display); font-size: 26px; font-weight: 800; text-transform: uppercase; }
.letter[disabled] { opacity: .25; }
.slot { min-width: 46px; height: 52px; border-bottom: 3px solid var(--ink); font-family: var(--display); font-size: 26px; font-weight: 800; text-transform: uppercase; display: grid; place-items: center; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf button { padding: 18px; font-size: 20px; font-family: var(--display); font-weight: 800; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); }

/* Shop */
.shop { display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
.shop-preview { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); display: grid; gap: 12px; justify-items: center; text-align: center; }
.items { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.item { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 10px 12px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.item.equipped { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.item-ico { font-size: 38px; height: 50px; display: grid; place-items: center; }
.item-swatch { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); }

/* Board & progress */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
tr.me td { background: var(--surface-2); font-weight: 600; }
.rank { font-family: var(--display); font-weight: 800; font-size: 20px; width: 40px; }
.medal-1 { color: #d39b00; } .medal-2 { color: #8a96a8; } .medal-3 { color: #b4693a; }
.badges { display: flex; gap: 10px; flex-wrap: wrap; }
.badge { display: flex; gap: 8px; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--surface); }
.badge.locked { opacity: .45; border-style: dashed; }
.badge b { font-family: var(--display); }
.notice { border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px 14px; color: var(--muted); font-size: 14px; }


/* Fix-it lessons: a chalkboard "video" stage, one deliberate dark look in both themes */
.player-wrap { max-width: 860px; width: 100%; margin: 0 auto; display: grid; gap: 14px; }
.player { border-radius: 18px; overflow: hidden; border: 1.5px solid var(--line); box-shadow: var(--shadow); background: #0b1813; }
.stage { position: relative; aspect-ratio: 16 / 9; min-height: 300px; max-width: 100%; display: grid; place-items: center; text-align: center; color: #f3f1e7;
  padding: 56px clamp(18px, 5vw, 64px) 44px; background: radial-gradient(120% 90% at 20% 10%, #23463a 0%, #12281f 55%, #0b1b15 100%); }
.sc-tag { position: absolute; top: 16px; left: 16px; background: #ffd95e; color: #2c2300; font: 700 12px var(--body); padding: 4px 11px; border-radius: 999px; letter-spacing: .06em; text-transform: uppercase; }
.sc-brand { position: absolute; bottom: 12px; right: 16px; font: 700 12px var(--display); color: rgba(243, 241, 231, .45); }
.sc-body { display: grid; gap: 14px; max-width: 48ch; animation: scIn .6s ease-out; }
@keyframes scIn { from { transform: translateY(14px); opacity: .3; } to { transform: none; opacity: 1; } }
.sc-title { font: 800 clamp(26px, 4.4vw, 42px)/1.1 var(--display); text-wrap: balance; }
.sc-text { font-size: clamp(15px, 2.1vw, 19px); line-height: 1.5; color: #dce6dc; }
.sc-text.big { font: 600 clamp(18px, 2.7vw, 25px)/1.4 var(--display); color: #f3f1e7; }
.sc-q { font: 700 clamp(18px, 3vw, 27px)/1.25 var(--display); overflow-wrap: anywhere; }
.sc-ans { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; font: 700 clamp(17px, 2.6vw, 24px) var(--display); }
.sc-was { padding: 0 6px; color: #ff9aa3; text-decoration: line-through; text-decoration-thickness: 3px; }
.sc-right { color: #10281d; background: #7ee0ad; padding: 2px 12px; border-radius: 10px; animation: scPop .5s .5s ease-out backwards; }
@keyframes scPop { from { transform: scale(.7); } to { transform: scale(1); } }
.sc-steps { text-align: left; margin: 0; padding-left: 1.3em; display: grid; gap: 10px; font-size: clamp(15px, 2.1vw, 19px); line-height: 1.45; }
.stage .btn:not(.btn-marker) { background: transparent; color: #f3f1e7; border-color: rgba(243, 241, 231, .4); }
.sc-reward { color: #ffd95e; font-weight: 700; }
.controls { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #0b1813; color: #e8efe8; flex-wrap: wrap; }
.controls .cb { background: none; border: 0; color: inherit; font: 600 14px var(--body); padding: 6px 9px; border-radius: 8px; min-width: 36px; }
.controls .cb:hover:not([disabled]) { background: rgba(255, 255, 255, .1); }
.controls .cb[disabled] { opacity: .35; cursor: default; }
.controls .cb[aria-pressed="false"] { color: rgba(232, 239, 232, .55); }
.segs { flex: 1; display: flex; gap: 4px; min-width: 120px; }
.seg-b { flex: 1; height: 22px; border: 0; padding: 0; background: none; display: grid; align-items: center; }
.seg-track { display: block; height: 6px; background: rgba(255, 255, 255, .18); border-radius: 3px; overflow: hidden; }
.seg-fill { display: block; height: 100%; background: #ffd95e; }
.ltime { font: 600 12px var(--body); color: rgba(232, 239, 232, .7); font-variant-numeric: tabular-nums; }
.mistake { display: flex; gap: 12px; align-items: center; justify-content: space-between; border: 1.5px solid var(--line); border-left: 5px solid var(--sc); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.mistake b { overflow-wrap: anywhere; font-weight: 600; }
.was { color: var(--bad); text-decoration: line-through; }
.right { color: var(--ok); font-weight: 600; }
@media (max-width: 520px) { .mistake { flex-direction: column; align-items: stretch; } .stage { aspect-ratio: auto; min-height: 320px; } }


/* Subject artwork and visuals */
.sicon { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: var(--sc); background: color-mix(in srgb, var(--sc) 14%, var(--surface)); flex: none; }
.sicon svg { width: 20px; height: 20px; }
.sicon.big { width: 46px; height: 46px; border-radius: 13px; }
.sicon.big svg { width: 30px; height: 30px; }
.skill-card { background: linear-gradient(160deg, color-mix(in srgb, var(--sc) 7%, var(--surface)) 0%, var(--surface) 55%); transition: transform .15s ease, box-shadow .15s ease; }
.skill-card:hover { transform: translateY(-2px); box-shadow: 0 1px 0 var(--line), 0 10px 24px rgba(27, 37, 80, .1); }
.book-name { margin-top: -6px; }
.book-sec { gap: 12px; }
.book-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--r); border: 1.5px solid var(--line); background: linear-gradient(100deg, color-mix(in srgb, var(--sc) 16%, var(--surface)), var(--surface) 70%); }
.subj-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.subj-tab { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; font-weight: 600; text-align: left; min-width: 0; }
.subj-tab span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subj-tab[aria-pressed="true"] { border-color: var(--sc); background: color-mix(in srgb, var(--sc) 12%, var(--surface)); box-shadow: 0 3px 0 var(--sc); }
